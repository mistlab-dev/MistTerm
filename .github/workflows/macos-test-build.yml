# 临时：AI 智控台+主题修复 的 macOS 未签名测试包（无密钥、无签名、不发布）。合并前删除。
name: macOS unsigned test build
on:
  push:
    branches: [fix/ai-console-polish]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal
        env:
          # 临时测试公钥(一次性，非正式签名钥匙)，只对 update-test 构建生效，用来验证 .github/au-test/latest.json
          MIST_UPDATE_TEST_PUBKEY: RWSXr+uNi0yKjxW0TbmXFK/OEkxhtEbUHBDntMahSyyKhG2z4PP9gGhf
        run: |
          set -euo pipefail
          # 测试包版本标成 1.2.9，便于看出更新成功(更新后「关于」应显示 v1.2.10)
          perl -0pi -e 's/name = "mistterm"\nversion = "1.2.10"/name = "mistterm"\nversion = "1.2.9"/' Cargo.lock
          perl -0pi -e 's/^version = "1.2.10"/version = "1.2.9"/m' Cargo.toml
          perl -pi -e 's#<string>1.2.10</string>#<string>1.2.9</string>#g' Info.plist
          mkdir -p target/universal-apple-darwin/release
          for BIN in Mist mist; do
            cargo build --locked --release --bin "$BIN" --target aarch64-apple-darwin --features vendored-openssl,update-test
            cargo build --locked --release --bin "$BIN" --target x86_64-apple-darwin --features vendored-openssl,update-test
            lipo -create -output "target/universal-apple-darwin/release/$BIN" \
              "target/aarch64-apple-darwin/release/$BIN" "target/x86_64-apple-darwin/release/$BIN"
          done
          MIST_BINARY=target/universal-apple-darwin/release/Mist MIST_APP_OUT=out/Mist.app bash scripts/bundle-macos.sh
          cp .github/au-test/latest.json .github/au-test/latest.json.minisig out/
          cd out && ditto -c -k --keepParent Mist.app Mist-macos-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Mist-macos-unsigned
          path: |
            out/Mist-macos-unsigned.zip
            out/latest.json
            out/latest.json.minisig
          retention-days: 7
