# 临时：macOS 未签名测试包（无密钥、无签名、不发布）。合并前删除。
name: macOS unsigned test build
on:
  push:
    branches: [fix/mac-debug-log]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal GUI only
        run: |
          set -euo pipefail
          U=target/universal-apple-darwin/release
          mkdir -p $U
          cargo build --locked --release --bin Mist --target aarch64-apple-darwin --features vendored-openssl
          cargo build --locked --release --bin Mist --target x86_64-apple-darwin --features vendored-openssl
          lipo -create -output $U/Mist target/aarch64-apple-darwin/release/Mist target/x86_64-apple-darwin/release/Mist
          echo "mist-debug-log count: $(grep -a -c -F mist-debug-log $U/Mist)"
          grep -a -q -F mist-debug-log $U/Mist
          MIST_BINARY=$U/Mist MIST_APP_OUT=out/Mist.app bash scripts/bundle-macos.sh
          grep -a -q -F mist-debug-log out/Mist.app/Contents/MacOS/Mist
          cd out && ditto -c -k --keepParent Mist.app Mist-macos-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Mist-macos-unsigned
          path: out/Mist-macos-unsigned.zip
          retention-days: 7
