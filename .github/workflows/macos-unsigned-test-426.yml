# Temporary unsigned macOS test build for PR #426 IME check. Do not merge. Not a release.
name: macOS unsigned test build
on:
  workflow_dispatch:
  push:
    branches: [test/426-macos-unsigned]
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mistterm
          key: macos-aarch64-vendored-openssl
          cache-on-failure: true
      - name: Install macOS dependencies
        run: brew install libssh2 pkg-config
      - name: Build and bundle unsigned arm64 app
        run: |
          set -euo pipefail
          cargo build --locked --release --bin Mist --target aarch64-apple-darwin --features vendored-openssl
          mkdir -p out
          MIST_BINARY=target/aarch64-apple-darwin/release/Mist \
            MIST_APP_OUT=out/Mist.app \
            bash scripts/bundle-macos.sh
          cd out && ditto -c -k --keepParent Mist.app Mist-macos-unsigned-426.zip
          ls -lh Mist-macos-unsigned-426.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Mist-macos-unsigned-426
          path: out/Mist-macos-unsigned-426.zip
          retention-days: 3
