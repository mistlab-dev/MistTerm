name: Set auto_update in manifests

# Set every platform auto_update on the live v* release latest.json
# (true or false), re-sign, upload to GitHub Release, and rsync to
# mistlab mirror when DEPLOY_* secrets are present (missing secrets
# warn only — box can sync).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (no leading v)"
        required: true
        type: string
      auto_update:
        description: "Set platforms[].auto_update to this value"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: set-auto-update-${{ inputs.version }}-${{ inputs.auto_update }}
  cancel-in-progress: false

jobs:
  set-auto-update:
    name: Set auto_update
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign rsync openssh-client

      - name: Download and patch latest.json
        env:
          VERSION_INPUT: ${{ inputs.version }}
          AUTO_UPDATE_INPUT: ${{ inputs.auto_update }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "AUTO_UPDATE=${AUTO_UPDATE_INPUT}" >> "$GITHUB_ENV"
          mkdir -p dist
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir dist --clobber
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("dist/latest.json")
          m = json.loads(p.read_text())
          flag = os.environ.get("AUTO_UPDATE_INPUT", "false").lower() in ("1", "true", "yes")
          for k, plat in m.get("platforms", {}).items():
              plat["auto_update"] = flag
          p.write_text(json.dumps(m, indent=2, ensure_ascii=False) + "\n")
          print("version", m["version"], "auto_update", flag, "platforms", len(m["platforms"]))
          for k, plat in m["platforms"].items():
              print(k, plat.get("auto_update"))
          PY
          python3 scripts/gen-update-manifest.py --trusted-comment-of dist/latest.json > dist/latest.json.tc
          echo "Trusted comment: $(cat dist/latest.json.tc)"

      - name: Sign latest.json
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          TC="$(cat dist/latest.json.tc)"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY" -m dist/latest.json -t "$TC" -c "mistterm update manifest"
          minisign -V -p resources/update/minisign-primary.pub -m dist/latest.json
          grep -q "^trusted comment: $(cat dist/latest.json.tc)\$" dist/latest.json.minisig

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" dist/latest.json dist/latest.json.minisig --repo "$GITHUB_REPOSITORY" --clobber

      - name: Sync mistlab mirror manifests
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::warning::DEPLOY_* secrets missing; signed files are on the GitHub Release only — sync mistlab from box"
            exit 0
          fi
          umask 077
          KEY="$RUNNER_TEMP/deploy.key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          KH="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KH"
          trap 'rm -f "$KEY"' EXIT
          BASE="${DEPLOY_PATH:-/var/www/mistlab/downloads/mistterm}"
          DEST="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSH=(ssh -i "$KEY" -o UserKnownHostsFile="$KH" -o StrictHostKeyChecking=yes)
          RSYNC=(rsync -av -e "ssh -i $KEY -o UserKnownHostsFile=$KH -o StrictHostKeyChecking=yes")
          # version dir + stable channel + root aliases used by site/clients
          "${SSH[@]}" "$DEST" "mkdir -p '${BASE}/v${VERSION}' '${BASE}/stable'"
          "${RSYNC[@]}" dist/latest.json dist/latest.json.minisig "$DEST:${BASE}/v${VERSION}/"
          "${RSYNC[@]}" dist/latest.json dist/latest.json.minisig "$DEST:${BASE}/stable/"
          "${RSYNC[@]}" dist/latest.json dist/latest.json.minisig "$DEST:${BASE}/"
          # stable.json is a duplicate of the channel tip
          scp -i "$KEY" -o UserKnownHostsFile="$KH" -o StrictHostKeyChecking=yes \
            dist/latest.json "$DEST:${BASE}/stable.json"
          scp -i "$KEY" -o UserKnownHostsFile="$KH" -o StrictHostKeyChecking=yes \
            dist/latest.json.minisig "$DEST:${BASE}/stable.json.minisig"
          "${SSH[@]}" "$DEST" "ls -la '${BASE}/stable/latest.json' '${BASE}/latest.json' '${BASE}/v${VERSION}/latest.json'"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: set-auto-update-manifest
          path: |
            dist/latest.json
            dist/latest.json.minisig
            dist/latest.json.tc
