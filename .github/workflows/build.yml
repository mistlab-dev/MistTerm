name: Build & Test

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  BIN_NAME: Mist
  # 只有推送 v* 标签的正式构建才标记为官方发布渠道（github-release）。
  # build.rs 在这种构建里会检查内置的更新公钥（占位符 / 格式错误 / 主备相同都会直接失败），
  # 防止发出一个永远无法自动更新的版本。手动触发的测试构建不受影响。
  MIST_DIST_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'github-release' || '' }}

jobs:
  # 发版前置检查：标签 = Cargo.toml = Info.plist，否则装好的新版会把自己当旧版，更新提示会反复出现。
  preflight:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-version-consistency.py --self-test
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 scripts/check-version-consistency.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check-version-consistency.py
          fi

      - name: Self-test update manifest generator
        shell: bash
        run: python3 scripts/gen-update-manifest.py --self-test

  # 三平台并行。单元测试 + 集成测试仅在 Linux（mold + 系统 OpenSSL，最快）；
  # Windows / macOS 只 release 构建 + 打包，依赖 rust-cache 复用增量编译。
  platform:
    name: ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            # Pin until we intentionally validate Ubuntu 26 (ubuntu-latest migrates 2026-10-19).
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            cargo_features: ""
            run_unit_tests: true
            run_integration_tests: true
            use_mold: true

          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            archive_ext: zip
            cargo_features: vendored-openssl
            run_unit_tests: false
            run_integration_tests: false
            use_mold: false

          - platform: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            archive_ext: tar.gz
            cargo_features: vendored-openssl
            run_unit_tests: false
            run_integration_tests: false
            use_mold: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse HEAD)"
          echo "Tag SHA: $TAG_SHA"
          echo "Fetching origin/main..."
          git fetch origin main --force
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "origin/main SHA: $MAIN_SHA"
          if git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "✅ Tag commit is on main"
          else
            echo "::error::Release tag ($TAG_SHA) is not on origin/main ($MAIN_SHA). Merge to main before tagging."
            echo "Commits on main since tag:"
            git log --oneline "$TAG_SHA..origin/main" || true
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mistterm
          key: ${{ matrix.platform }}-${{ matrix.cargo_features || 'default' }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config mold \
            libssl-dev libssh2-1-dev \
            libx11-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libgtk-3-dev libdbus-1-dev \
            openssh-server lrzsz

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libssh2 pkg-config

      # Avoid ilammy/msvc-dev-cmd (still declares Node 20; upstream Node 24 PR unmerged).
      # Capture VsDevCmd env the same way: run the bat under cmd, then persist diffs to GITHUB_ENV.
      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "MSVC installation not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $devcmd)) { throw "VsDevCmd.bat not found at $devcmd" }

          $out = cmd /c "call `"$devcmd`" -arch=x64 -host_arch=x64 -no_logo && set"
          if ($LASTEXITCODE -ne 0 -or -not $out) {
            throw "VsDevCmd.bat failed with exit $LASTEXITCODE"
          }

          $written = 0
          $sawPath = $false
          foreach ($line in $out) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name = $Matches[1]
            $value = $Matches[2]
            # Skip cmd pseudo-vars ("=C:", "=ExitCode") — already excluded by the pattern.
            if ([Environment]::GetEnvironmentVariable($name) -eq $value) { continue }
            if ($name -ieq 'Path') { $name = 'PATH'; $sawPath = $true }
            Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
            $written++
          }
          if (-not $sawPath) { throw "VsDevCmd.bat left PATH unchanged — toolchain missing" }
          Write-Host "MSVC environment from $vs ($written vars)"

      - name: Check egui lock re-entrancy
        if: matrix.run_unit_tests
        shell: bash
        run: |
          python3 scripts/check-egui-reentrancy.py --self-test
          python3 scripts/check-egui-reentrancy.py

      - name: Check third-party license notices
        if: matrix.run_unit_tests
        shell: bash
        run: python3 scripts/generate-third-party-licenses.py --check

      - name: Run unit tests (Linux)
        if: matrix.run_unit_tests
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.use_mold && '-C link-arg=-fuse-ld=mold' || '' }}
        run: |
          set -euo pipefail
          features="${{ matrix.cargo_features }}"
          features_arg=()
          if [ -n "$features" ]; then
            features_arg=(--features "$features")
          fi
          cargo test --locked --release --lib --tests "${features_arg[@]}"
          cargo test --locked --release --examples "${features_arg[@]}"

      - name: Setup SSH test server
        if: matrix.run_integration_tests
        run: |
          sudo mkdir -p /var/run/sshd
          sudo useradd -m -s /bin/bash mistterm_test || true
          echo "mistterm_test:test123456" | sudo chpasswd
          sudo service ssh start

      - name: Run integration tests
        if: matrix.run_integration_tests
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.use_mold && '-C link-arg=-fuse-ld=mold' || '' }}
        run: |
          set -euo pipefail
          cargo test --locked --release --test zmodem_integration_test
          cargo test --locked --release --test zmodem_integration_test test_ssh_connect -- --ignored --exact

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.use_mold && '-C link-arg=-fuse-ld=mold' || '' }}
        run: |
          set -euo pipefail
          features="${{ matrix.cargo_features }}"
          features_arg=()
          if [ -n "$features" ]; then
            features_arg=(--features "$features")
          fi

          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            mkdir -p "target/${{ matrix.target }}/release"
            for BIN in "$BIN_NAME" mist; do
              cargo build --locked --release --bin "$BIN" --target aarch64-apple-darwin "${features_arg[@]}"
              cargo build --locked --release --bin "$BIN" --target x86_64-apple-darwin "${features_arg[@]}"
              lipo -create -output \
                "target/${{ matrix.target }}/release/$BIN" \
                "target/aarch64-apple-darwin/release/$BIN" \
                "target/x86_64-apple-darwin/release/$BIN"
            done
            file "target/${{ matrix.target }}/release/$BIN_NAME" "target/${{ matrix.target }}/release/mist"
          else
            cargo build --locked --release --bin "$BIN_NAME" --target "${{ matrix.target }}" "${features_arg[@]}"
            cargo build --locked --release --bin mist --target "${{ matrix.target }}" "${features_arg[@]}"
          fi

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $features = "${{ matrix.cargo_features }}"
          $featuresArg = @()
          if ($features) { $featuresArg = @("--features", $features) }
          $outDir = "target/${{ matrix.target }}/release"
          $stash = Join-Path $env:RUNNER_TEMP "mistterm-bins"
          New-Item -ItemType Directory -Force -Path $stash | Out-Null

          # Windows FS is case-insensitive: Mist.exe and mist.exe are the same path.
          # Build GUI first, stash it, then build CLI under a distinct name.
          cargo build --locked --release --bin $env:BIN_NAME --target "${{ matrix.target }}" @featuresArg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Force (Join-Path $outDir "$env:BIN_NAME.exe") (Join-Path $stash "Mist.exe")

          cargo build --locked --release --bin mist --target "${{ matrix.target }}" @featuresArg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Force (Join-Path $outDir "mist.exe") (Join-Path $stash "mist-cli.exe")

          # Restore GUI to the path packaging/installer expect.
          Copy-Item -Force (Join-Path $stash "Mist.exe") (Join-Path $outDir "Mist.exe")
          Copy-Item -Force (Join-Path $stash "mist-cli.exe") (Join-Path $outDir "mist-cli.exe")
          # Convenience launcher so `mist` still works from PATH after unzip.
          Set-Content -Path (Join-Path $outDir "mist.cmd") -Value "@echo off`r`n`"%~dp0mist-cli.exe`" %*`r`n" -Encoding ASCII
          Write-Host "Stashed GUI+CLI to $stash (avoid Mist/mist collision)"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y --no-progress
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC not found after Inno Setup install" }
          powershell -ExecutionPolicy Bypass -File scripts/package-windows-installer.ps1 -SkipBuild -Target "${{ matrix.target }}" -IsccPath $iscc

      - name: Package artifact
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          NAME="$BIN_NAME-${{ matrix.platform }}"
          mkdir -p dist

          if [ "${{ matrix.archive_ext }}" = "dmg" ]; then
            if [ "${{ runner.os }}" = "macOS" ]; then
              # Universal binary is already lipo-merged; remove per-arch build leftovers
              # to prevent hdiutil from failing with "No space left on device".
              rm -rf target/aarch64-apple-darwin/release/{build,deps,examples,incremental} || true
              rm -rf target/x86_64-apple-darwin/release/{build,deps,examples,incremental} || true
              df -h
            fi
            MIST_BINARY="target/${{ matrix.target }}/release/$BIN_NAME" \
              bash scripts/bundle-macos.sh
            artifact="$NAME.dmg"
            bash scripts/sign-and-notarize-macos.sh "target/release/Mist.app" "dist/$artifact"
          else
            STAGE="dist/$NAME"
            mkdir -p "$STAGE"

            if [ "${{ runner.os }}" = "Windows" ]; then
              # Distinct names: Mist.exe (GUI) + mist-cli.exe (CLI). mist.exe would collide on NTFS.
              cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" "$STAGE/"
              cp "target/${{ matrix.target }}/release/mist-cli.exe" "$STAGE/"
              cp "target/${{ matrix.target }}/release/mist.cmd" "$STAGE/"
            elif [ "${{ runner.os }}" = "macOS" ]; then
              # 打成 Mist.app，避免用户双击裸二进制时先弹出 Terminal.app
              MIST_BINARY="target/${{ matrix.target }}/release/$BIN_NAME" \
                MIST_APP_OUT="$STAGE/Mist.app" \
                bash scripts/bundle-macos.sh

              # Developer ID 签名 + 公证（Mist.app 与 DMG）
              rm -rf target/aarch64-apple-darwin/release/{build,deps,examples,incremental} || true
              rm -rf target/x86_64-apple-darwin/release/{build,deps,examples,incremental} || true
              df -h . || true
              DMG_OUT="dist/${NAME}.dmg"
              echo "::notice title=macOS signing::bundle done; starting codesign + notary (poll heartbeats every 20s, timeout 20m)"
              echo "APP=$STAGE/Mist.app"
              echo "DMG=$DMG_OUT"
              date -u +"sign_notarize_start=%Y-%m-%dT%H:%M:%SZ"
              bash scripts/sign-and-notarize-macos.sh "$STAGE/Mist.app" "$DMG_OUT"
              date -u +"sign_notarize_end=%Y-%m-%dT%H:%M:%SZ"
              echo "MACOS_DMG_PATH=$DMG_OUT" >> "$GITHUB_ENV"
              echo "MACOS_DMG_NAME=${NAME}.dmg" >> "$GITHUB_ENV"

              # 附带裸二进制，供 CLI / install.sh 使用；GUI 请用已公证的 Mist.app
              cp "target/${{ matrix.target }}/release/$BIN_NAME" "$STAGE/"
              cp "target/${{ matrix.target }}/release/mist" "$STAGE/"
              printf '%s\n' \
                'MistTerm for macOS' \
                '==================' \
                'GUI (recommended, notarized Mist.app):' \
                '  open Mist.app' \
                '  or drag Mist.app to /Applications' \
                '  Prefer the .dmg release asset when available.' \
                '' \
                'Do not double-click the bare Mist binary in Finder,' \
                'or macOS will open Terminal.app first.' \
                > "$STAGE/README-macOS.txt"
            else
              cp "target/${{ matrix.target }}/release/$BIN_NAME" "$STAGE/"
              cp "target/${{ matrix.target }}/release/mist" "$STAGE/"
            fi
            [ -f README.md ] && cp README.md "$STAGE/" || true
            [ -f docs/en/INSTALL.md ] && cp docs/en/INSTALL.md "$STAGE/INSTALL.md" || true
            [ -f docs/zh/INSTALL.md ] && cp docs/zh/INSTALL.md "$STAGE/INSTALL.zh.md" || true
            [ -f LICENSE ] && cp LICENSE "$STAGE/" || true

            cd dist
            if [ "${{ matrix.archive_ext }}" = "zip" ]; then
              7z a -tzip "$NAME.zip" "$NAME" >/dev/null
              artifact="$NAME.zip"
            else
              tar -czf "$NAME.tar.gz" "$NAME"
              artifact="$NAME.tar.gz"
            fi
            cd ..
          fi

          echo "ARTIFACT_PATH=dist/$artifact" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$artifact" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS' && env.MACOS_DMG_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MACOS_DMG_NAME }}
          path: ${{ env.MACOS_DMG_PATH }}
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: MistTerm-windows-x86_64-setup
          path: dist/MistTerm-*-windows-x86_64-setup.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 自动更新（P1）：生成 latest.json → 用 minisign 签名 → 与安装包一起发布。
  # 设计与发版步骤见 docs/release/AUTO_UPDATE.md。
  # ---------------------------------------------------------------------------
  manifest:
    name: Update manifest
    needs: platform
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS and latest.json
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          VERSION="${GITHUB_REF_NAME#v}"
          notes_args=()
          for lang in zh en; do
            f="docs/release/notes/v${VERSION}.${lang}.md"
            if [ -f "$f" ]; then notes_args+=("--notes-${lang}" "$f"); fi
          done
          # 镜像（mistlab.dev）上传还没开通：MIST_MIRROR_ENABLED 不是 'true' 时不写镜像地址。
          mirror_args=()
          if [ "${{ vars.MIST_MIRROR_ENABLED }}" = "true" ] && [ -n "${{ vars.MIST_MIRROR_BASE_URL }}" ]; then
            mirror_args+=(--mirror-base "${{ vars.MIST_MIRROR_BASE_URL }}/v${VERSION}")
          fi
          python3 scripts/gen-update-manifest.py \
            --tag "$GITHUB_REF_NAME" \
            --dist dist \
            --out dist/latest.json \
            --url-order github,mirror \
            "${notes_args[@]}" "${mirror_args[@]}"
          cat dist/latest.json
          python3 scripts/gen-update-manifest.py --trusted-comment-of dist/latest.json > dist/latest.json.tc
          echo "Trusted comment: $(cat dist/latest.json.tc)"

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: update-manifest
          path: |
            dist/latest.json
            dist/latest.json.tc
            dist/SHA256SUMS
          if-no-files-found: error

  # 签名私钥只放在 `release` 环境的 secrets 里（Tian 审批后才会运行）。
  # 这个 job 不签出 PR 代码之外的东西，也不接触安装包本身，只签两个小文件。
  sign:
    name: Sign update manifest
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Checkout (for the committed public key)
        uses: actions/checkout@v6

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: update-manifest
          path: dist

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign latest.json and SHA256SUMS
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ] || [ -z "${MINISIGN_PASSWORD}" ]; then
            echo "::error::MINISIGN_SECRET_KEY / MINISIGN_PASSWORD are not set in the 'release' environment. See docs/release/AUTO_UPDATE.md."
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          TC="$(cat dist/latest.json.tc)"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY" -m dist/latest.json -t "$TC" -c "mistterm update manifest"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY" -m dist/SHA256SUMS -t "mistterm SHA256SUMS ${GITHUB_REF_NAME}" -c "mistterm checksums"
          rm -f "$KEY"

      - name: Verify with the committed public key
        shell: bash
        run: |
          set -euo pipefail
          # 用仓库里提交的公钥（也就是客户端内置的那把）验证，私钥和公钥对不上就不发布。
          minisign -V -p resources/update/minisign-primary.pub -m dist/latest.json
          minisign -V -p resources/update/minisign-primary.pub -m dist/SHA256SUMS
          grep -q "^trusted comment: $(cat dist/latest.json.tc)\$" dist/latest.json.minisig

      - name: Upload signatures
        uses: actions/upload-artifact@v7
        with:
          name: update-signatures
          path: |
            dist/latest.json.minisig
            dist/SHA256SUMS.minisig
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [platform, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      # SHA256SUMS / latest.json 由 manifest job 生成并已签名，这里只核对，不重算。
      - name: Verify checksums and drop helper files
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f latest.json.tc
          sha256sum -c SHA256SUMS
          for f in latest.json latest.json.minisig SHA256SUMS SHA256SUMS.minisig; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Downloads

            Pick the archive for your platform:

            - **macOS**: `Mist-macos-universal.dmg` (signed + notarized, recommended) or `Mist-macos-universal.tar.gz`
            - **Linux**: `Mist-linux-x86_64.tar.gz`
            - **Windows**: `MistTerm-*-windows-x86_64-setup.exe` (recommended) or `Mist-windows-x86_64.zip`

            - Website: https://mistlab.dev
            - Documentation: https://github.com/mistlab-dev/MistTerm/tree/main/docs
            - Issues: https://github.com/mistlab-dev/MistTerm/issues

  # 镜像上传（mistlab.dev/downloads/mistterm/...）——尚未开通。
  # TODO(Tian)：配置好 nginx 的 /downloads 目录和只能写该目录的部署密钥后，
  # 把仓库变量 MIST_MIRROR_ENABLED 设为 'true'，并在这里实现 rsync 上传
  # （先传安装包，再传 latest.json / .minisig，保证用户永远看不到"清单已更新、文件还没到"的状态）。
  mirror:
