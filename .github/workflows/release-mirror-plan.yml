name: Release mirror plan

# 发版计划自测：镜像顺序，以及 main 上哪些提交可以打标签。
# 不连生产机，不打标签，不上传，不需要 secrets。
on:
  pull_request:
    paths:
      - scripts/sync-release-mirror.py
      - scripts/plan-release-tag.py
      - .github/workflows/build.yml
      - .github/workflows/tag-release.yml
      - .github/workflows/release-mirror-plan.yml
      - docs/release/AUTO_UPDATE.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Mirror plan self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-test mirror planner
        run: python3 scripts/sync-release-mirror.py --self-test

      - name: Self-test release tag planner
        run: python3 scripts/plan-release-tag.py --self-test
