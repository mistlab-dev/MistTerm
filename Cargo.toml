[package]
name = "mistterm"
version = "1.3.2"
edition = "2021"
autobins = false
default-run = "Mist"
description = "A modern SSH terminal with lrzsz support"
homepage = "https://mistlab.dev"
documentation = "https://github.com/mistlab-dev/MistTerm/tree/main/docs"
repository = "https://github.com/mistlab-dev/MistTerm"
license = "AGPL-3.0-or-later"

[features]
default = ["file-dialogs"]
# 桌面版的系统文件选择框（rfd，Linux 上依赖 GTK3）。只编命令行 `mist` 的静态版本（musl）时关掉，
# 见 docs/release/CLI_STATIC.md。
file-dialogs = ["dep:rfd"]
# 让 ssh2 / openssl-sys 自带源码编译 OpenSSL，便于 CI 跨平台构建（macOS 单架构交叉编译等）。
vendored-openssl = ["ssh2/vendored-openssl"]
# 仅用于自动更新的端到端测试：信任编译时传入的临时测试公钥、允许 http://127.0.0.1 假服务器、
# 允许用 MIST_BUILD_VERSION 覆盖版本号。正式发布构建禁止开启（build.rs 会报错）。
update-test = []

[lib]
name = "mistterm"
path = "src/lib.rs"

[[bin]]
name = "test_file_transfer_md5"
path = "src/bin/test_file_transfer_md5.rs"

[[bin]]
name = "test_file_transfer"
path = "src/bin/test_file_transfer.rs"

[[bin]]
name = "test_zmodem"
path = "src/bin/test_zmodem.rs"

[[bin]]
name = "rz_upload_smoke"
path = "src/bin/rz_upload_smoke.rs"

[[bin]]
name = "Mist"
path = "src/main.rs"
# 桌面版必须带文件选择框；`--no-default-features` 的静态 CLI 构建不会编它。
required-features = ["file-dialogs"]

[[bin]]
name = "mist"
path = "src/bin/mist.rs"

[[bin]]
name = "seed_local_test_session"
path = "src/bin/seed_local_test_session.rs"

[[bin]]
name = "export_app_icon"
path = "src/bin/export_app_icon.rs"

[dependencies]
md5 = "0.7"
# GUI - eframe 0.37（MSRV 1.95）。wgpu feature 编入但运行时显式 Renderer::Glow
# （0.25+ 双开默认偏 wgpu、0.34+ wgpu 成默认；是否切 wgpu 另票拍板，见 #204）。
# Linux：x11+wayland 自 0.30 起须显式开启。
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["all_loaders"] }

# Async runtime - tokio with full features
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# SSH - Pure Rust implementation
ssh2 = "0.9"

# Terminal emulation - vte for ANSI parsing
vte = "0.11"
unicode-width = "0.1"

# Clipboard - Pure Rust
arboard = "3.3"

# Cross-platform keyring for password storage
keyring = "2.3"

# File dialogs (cross-platform)
rfd = { version = "0.12", optional = true }

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Encryption for password storage
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"
hkdf = "0.12"
sha2 = "0.10"
# 跨设备凭证信封的口令派生。参数写在 kdf_hint 里，服务器只存密文。
argon2 = "0.5"
# 导入 FinalShell 会话时解开它保存的密码（DES）
des = "0.8"
# 读 Xshell 会话文件（UTF-16 / GBK）
encoding_rs = "0.8"

# HTTP（Vault API、审计远程 sink）
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
log = "0.4"

# Command audit pattern matching
regex = "1.10"

# Misc
parking_lot = "0.12"
shellexpand = "3.1"
clap = { version = "4", features = ["derive"] }
dirs = "5.0"
chrono = "0.4"
crossterm = "0.27"
# 片段命令中 {{ ... }} 表达式（md5/base64 等），默认沙箱、无 IO
rhai = "1.19"

# Font support
ab_glyph = "0.2"
image = "0.24"
alacritty_terminal = "0.26.0"
# 本机终端（Win ConPTY / Unix PTY）
portable-pty = "0.8"
# ZMODEM 协议（lrzsz 路径专用；与 SFTP / cat 直传无关）
zmodem2 = { path = "vendor/zmodem2" }
egui_plot = "0.37"
pulldown-cmark = "0.11"
genpdf = "0.2"

# 自动更新：minisign 验签（零依赖）、版本比较、解压 Linux tar.gz / Windows 便携版 zip
minisign-verify = "0.3"
semver = "1"
tar = { version = "0.4", default-features = false }
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3.9"
mockall = "0.12"
ssh2 = "0.9"
dirs = "5.0"
serde_json = "1.0"
# 测试中生成临时 minisign 密钥并签名（只用于测试，不进入发布程序）
minisign = "0.10"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winreg"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
embed_plist = "1.2"
muda = "0.19"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Option-as-Alt 需要 WindowExtMacOS 等 macOS 扩展 trait。eframe 不重新导出 winit，
# 只放在 [patch.crates-io] 时 `use winit::...` 会 E0433。版本与 eframe 0.37 的 winit 0.30.x 对齐。
winit = { version = "0.30.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
# X11: deliver Control chords during IME preedit. See vendor/winit/MISTTERM_PATCH.md.
winit = { path = "vendor/winit" }
# X11 preedit end (`Preedit("", None)`) must clear the overlay. See vendor/egui-winit/MISTTERM_PATCH.md.
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = 3
# 用 thin LTO：链接时间显著降低（CI ~2-3x），二进制体积比 fat LTO 大 ~10-20%，
# 运行性能差异基本无感。GUI / IO 类应用切 thin 性价比最高。
lto = "thin"
# 只剥调试信息、保留符号表：hang 报告里的线程栈（hang_reporter 调 `sample`）才有函数名。
strip = "debuginfo"
